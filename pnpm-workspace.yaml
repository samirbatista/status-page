packages:
  - apps/*
  - packages/*

onlyBuiltDependencies:
  - '@prisma/engines'
  - '@swc/core'
  - argon2
  - esbuild
  - prisma
  - sharp

# Aceleradores nativos opcionais; os pacotes funcionam sem eles.
ignoredBuiltDependencies:
  - '@parcel/watcher'
  - msgpackr-extract

# Correções de segurança em dependências indiretas, até as diretas atualizarem.
overrides:
  # GHSA (DoS por upload pendente) — vem do @nestjs/platform-express.
  multer: ^2.5.0
