name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck, testes e build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: status
          POSTGRES_PASSWORD: status
          POSTGRES_DB: status
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U status -d status"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://status:status@localhost:5432/status
      REDIS_URL: redis://localhost:6379
      # Os testes da API usam um banco próprio (criado na hora) e o índice 15 do Redis.
      TEST_DATABASE_URL: postgresql://status:status@localhost:5432/status_test
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Formatação
        run: pnpm format:check
      - name: Migrações aplicam e batem com o schema
        run: |
          pnpm db:deploy
          pnpm --filter @status-page/db migrate:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  ldap:
    name: Login LDAP e AD contra servidores reais
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Sobe OpenLDAP e Samba AD
        run: timeout 600 docker/ldap-test/start.sh
      - name: Testes de integração LDAP
        env:
          TEST_OPENLDAP: localhost:1389
          TEST_SAMBA_AD: localhost:2636
        run: |
          pnpm turbo run build --filter=@status-page/core
          pnpm --filter @status-page/core exec vitest run src/ldap.integration.test.ts
      - name: Logs em caso de falha
        if: failure()
        run: docker logs sp-openldap; docker logs sp-samba | tail -50

  docker:
    name: Imagens Docker e smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Gera .env de teste
        run: |
          OWNER_PASSWORD=$(openssl rand -hex 16)
          echo "OWNER_PASSWORD=$OWNER_PASSWORD" >> "$GITHUB_ENV"
          cat > .env <<EOF
          POSTGRES_PASSWORD=$(openssl rand -hex 24)
          APP_SECRET=$(openssl rand -base64 32)
          SEED_OWNER_EMAIL=admin@example.com
          SEED_OWNER_PASSWORD=$OWNER_PASSWORD
          SEED_DEMO_PAGE=true
          EOF
      - name: Build
        run: docker compose build
      - name: Sobe a stack
        run: docker compose up -d --wait --wait-timeout 180
      - name: Smoke test
        run: |
          set -eux
          curl -fsS http://localhost/api/healthz
          curl -fsS http://localhost/api/readyz | grep '"status":"ok"'
          curl -fsS http://localhost/healthz
          curl -fsS http://localhost/ | grep 'Todos os sistemas operacionais'
          curl -fsS http://localhost/en-US | grep 'All systems operational'
          curl -fsS http://localhost/es | grep 'Todos los sistemas operativos'
          curl -fsS http://localhost/api/public/pages/demo | grep '"slug":"demo"'
          # Login pelo Caddy: cookie de sessão + rota autenticada.
          curl -fsS -c cookies.txt -H 'X-Requested-With: status-page' -H 'Content-Type: application/json' \
            -d "{\"email\":\"admin@example.com\",\"password\":\"$OWNER_PASSWORD\"}" http://localhost/api/auth/login
          curl -fsS -b cookies.txt http://localhost/api/auth/me | grep '"isOwner":true'
          curl -fsS -o /dev/null -b cookies.txt http://localhost/admin
          # F2: página em domínio próprio (Host), upload servido pelo Caddy e rota interna bloqueada.
          api() { curl -fsS -b cookies.txt -H 'X-Requested-With: status-page' -H 'Content-Type: application/json' "$@"; }
          PAGE=$(api -d '{"slug":"smoke","name":"Smoke Status"}' http://localhost/api/pages | jq -r .id)
          DOMAIN=$(api -d '{"hostname":"status.smoke.test"}' http://localhost/api/pages/$PAGE/domains | jq -r .id)
          api -X POST http://localhost/api/pages/$PAGE/domains/$DOMAIN/force-verify > /dev/null
          curl -fsS -H 'Host: status.smoke.test' http://localhost/ | grep -q 'Smoke Status'
          printf '\x89PNG\r\n\x1a\n0000' > logo.png
          UPLOAD=$(curl -fsS -b cookies.txt -H 'X-Requested-With: status-page' -F file=@logo.png http://localhost/api/pages/$PAGE/uploads | jq -r .id)
          curl -fsS -D - -o /dev/null http://localhost/api/public/uploads/$UPLOAD | grep -i 'content-security-policy:.*sandbox'
          test "$(curl -s -o /dev/null -w '%{http_code}' 'http://localhost/api/internal/tls-ask?domain=status.smoke.test')" = 404
      - name: Logs em caso de falha
        if: failure()
        run: docker compose logs --no-color
      - name: Derruba a stack
        if: always()
        run: docker compose down -v
