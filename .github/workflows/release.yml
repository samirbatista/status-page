name: Release

# Publica as imagens Docker no GitHub Container Registry e cria a release
# quando uma tag de versão é enviada (ex.: git tag v1.0.0 && git push origin v1.0.0).
# Execução manual (Actions → Release → Run workflow): só regenera as notas de uma release
# existente, sem publicar imagens.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag da release cujas notas serão regeneradas (ex.: v1.0.3)'
        required: true

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    name: Imagem ${{ matrix.service }}
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - service: api
            target: node-app
            package: '@status-page/api'
            system_packages: ''
          - service: worker
            target: node-app
            package: '@status-page/worker'
            system_packages: ''
          - service: monitor
            target: node-app
            package: '@status-page/monitor'
            system_packages: iputils-ping
          - service: web
            target: web
            package: ''
            system_packages: ''
          - service: migrate
            target: migrate
            package: ''
            system_packages: ''
    steps:
      - uses: actions/checkout@v7
      - name: Versão da tag bate com o package.json
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          test "$VERSION" = "$(jq -r .version package.json)" || {
            echo "tag $GITHUB_REF_NAME diferente da versão $(jq -r .version package.json) do package.json"; exit 1; }
          scripts/upgrade-path.sh check "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.service }}" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            PACKAGE=${{ matrix.package }}
            SYSTEM_PACKAGES=${{ matrix.system_packages }}
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.licenses=GPL-3.0-only
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  smoke:
    name: Instalação a partir das imagens publicadas
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: .env de teste com as imagens da release
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          OWNER_PASSWORD=$(openssl rand -hex 16)
          echo "OWNER_PASSWORD=$OWNER_PASSWORD" >> "$GITHUB_ENV"
          cat > .env <<EOF
          POSTGRES_PASSWORD=$(openssl rand -hex 24)
          APP_SECRET=$(openssl rand -base64 32)
          SEED_OWNER_EMAIL=admin@example.com
          SEED_OWNER_PASSWORD=$OWNER_PASSWORD
          SEED_DEMO_PAGE=true
          IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}
          IMAGE_TAG=$VERSION
          EOF
      - name: Sobe a stack sem compilar nada
        run: |
          docker compose pull
          docker compose up -d --no-build --wait --wait-timeout 180
      - name: Smoke test
        run: |
          set -eux
          curl -fsS http://localhost/api/readyz | grep '"status":"ok"'
          curl -fsS http://localhost/ | grep 'Todos os sistemas operacionais'
          curl -fsS http://localhost/api/docs/openapi.json | jq -e '.info.version == "'"${GITHUB_REF_NAME#v}"'"'
          curl -fsS http://localhost/api/public/pages/demo/status.json | jq -e '.status == "operational"'
      - name: Logs em caso de falha
        if: failure()
        run: docker compose logs --no-color
      - name: Derruba a stack
        if: always()
        run: docker compose down -v

  release:
    name: Release no GitHub
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Cria a release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          scripts/release-notes.sh "$GITHUB_REF_NAME" > notes.md
          gh release create "$GITHUB_REF_NAME" --title "Status Page ${GITHUB_REF_NAME#v}" --notes-file notes.md

  notes:
    name: Regenera as notas da release
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Atualiza as notas
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          scripts/release-notes.sh "$TAG" > notes.md
          cat notes.md
          gh release edit "$TAG" --notes-file notes.md
