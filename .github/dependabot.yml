# Atualizações de dependências: npm (pnpm), imagens Docker e GitHub Actions.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Os tipos acompanham o Node 24 das imagens (ver .nvmrc).
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
